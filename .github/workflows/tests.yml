# Intégration continue : lint + tests hors-ligne (aucun secret, aucun ordre, aucun réseau requis).
name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # chaque lundi : suite complète (tests lents inclus)
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Typage (mypy, mode souple)
        run: python -m mypy
      - name: Tests rapides
        if: github.event_name != 'schedule'
        run: python -m pytest -m "not slow"
      - name: Suite complète (hebdomadaire)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m pytest -n auto
