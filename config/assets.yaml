# Format : universe est une liste d'actifs décrits par ticker, name, category,
# universe_active, role (optionnel) et notes.
# role : candidate (classé par le Momentum), defensive (obligataire, classé
# seulement si strategy_params.yaml > universe.defensive_as_candidates vaut true),
# cash_proxy (monétaire, jamais classé : son rendement rémunère la poche cash).
# Sans champ role, l'actif est candidate.
# exposure (optionnel) : exposition économique (ex. msci_world). Plusieurs tickers peuvent
# implémenter la même exposition ; vehicle_priority (1 = préféré) départage, et le plan de
# versement bascule sur le véhicule suivant si une part du préféré dépasse le budget.
# proxy (optionnel) : ticker de même exposition servant à prolonger un historique court
# (données marquées « synthétiques », écart de suivi mesuré : `python main.py vehicles`).
# fiche (optionnel, v6) : identité vérifiée sur la fiche du produit — isin (clé de contrôle
# vérifiée), nom officiel, indice, frais courants (ter_pct), éligibilité PEA (true / false /
# null = non confirmée), date et source de vérification, alertes. `python main.py universe`.
# Categories utilisées : monde, us, emergents, europe, europe_croissance, emergents_asie,
# obligataire, obligations_souveraines, obligations_corporate, monetaire. universe_active
# contrôle l'inclusion dans le pipeline ; un actif indisponible reste documenté avec false.
universe:
