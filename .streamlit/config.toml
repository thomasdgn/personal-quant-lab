# Thème du tableau de bord (clair et sombre ; bascule dans le menu ⋮ > Settings).
[theme]
font = "Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
metricValueFontSize = "1.7rem"
metricValueFontWeight = 650

[theme.light]
primaryColor = "#2563eb"
backgroundColor = "#f7f8fb"
secondaryBackgroundColor = "#eef1f6"
textColor = "#0f172a"
borderColor = "#e2e8f0"
dataframeHeaderBackgroundColor = "#eef1f6"
linkColor = "#1d4ed8"
chartCategoricalColors = ["#2563eb", "#16a34a", "#f59e0b", "#9333ea", "#dc2626", "#0891b2", "#64748b", "#db2777"]

[theme.light.sidebar]
backgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#60a5fa"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#151e2e"
textColor = "#e2e8f0"
borderColor = "#243044"
dataframeHeaderBackgroundColor = "#151e2e"
linkColor = "#93c5fd"
chartCategoricalColors = ["#60a5fa", "#4ade80", "#fbbf24", "#c084fc", "#f87171", "#22d3ee", "#94a3b8", "#f472b6"]

[theme.dark.sidebar]
backgroundColor = "#0f1729"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
