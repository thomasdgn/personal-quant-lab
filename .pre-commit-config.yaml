# Hooks locaux (non installés automatiquement). Installation, environnement activé :
#   .venv\Scripts\Activate.ps1 ; python -m pre_commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        types: [python]
      - id: tests-rapides
        name: tests rapides (pytest -m "not slow")
        entry: python -m pytest -m "not slow" -q
        language: system
        pass_filenames: false
        types: [python]
